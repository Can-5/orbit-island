[package]
name = "orbit-island"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone Orbit Island engine: notification queue state machine + Orbit Module Protocol v1 message envelope. No UI, no platform code."
repository = "https://github.com/Can-5/orbit-island"
keywords = ["island", "notification", "orbit", "dynamic-island"]
categories = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
